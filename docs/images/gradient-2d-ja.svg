<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="t d">
  <title id="t">2変数の損失の等高線と勾配</title>
  <desc id="d">loss(w1,w2)=(w1-3)^2+(w2+1)^2 の等高線。中心 (3, -1) が最小。点 (5, 1) での勾配は右上を向き、更新はその逆向きに進みます。</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#172554;text-anchor:middle}
      .note{font-size:13px;fill:#475569}
    </style>
  </defs>
  <rect width="760" height="600" rx="24" fill="#f8fafc"/>
  <text x="380" y="42" font-size="22" font-weight="700">loss(w₁, w₂) = (w₁ − 3)² + (w₂ + 1)² の等高線</text>
  <path d="M150.0 319.99H610.02 M380.01 89.98000000000002V550.0" fill="none" stroke="#cbd5e1"/>
  <text x="626.02" y="324.99" class="note">w₁</text>
  <text x="380.01" y="79.98000000000002" class="note">w₂</text>
  <circle cx="380" cy="320" r="67" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.85"/>
  <rect x="307" y="356" width="52" height="18" rx="6" fill="#f8fafc"/>
  <text x="333" y="370" class="note" style="font-size:12px">loss=1</text>
  <circle cx="380" cy="320" r="133" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <rect x="260" y="403" width="52" height="18" rx="6" fill="#f8fafc"/>
  <text x="286" y="417" class="note" style="font-size:12px">loss=4</text>
  <circle cx="380" cy="320" r="200" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.45"/>
  <rect x="213" y="450" width="52" height="18" rx="6" fill="#f8fafc"/>
  <text x="239" y="464" class="note" style="font-size:12px">loss=9</text>
  <text x="180" y="544" class="note" style="font-size:12px">0</text>
  <text x="247" y="544" class="note" style="font-size:12px">1</text>
  <text x="313" y="544" class="note" style="font-size:12px">2</text>
  <text x="380" y="544" class="note" style="font-size:12px">3</text>
  <text x="447" y="544" class="note" style="font-size:12px">4</text>
  <text x="513" y="544" class="note" style="font-size:12px">5</text>
  <text x="580" y="544" class="note" style="font-size:12px">6</text>
  <circle cx="380" cy="320" r="7" fill="#16a34a"/>
  <text x="380" y="348" class="note" style="fill:#15803d">最小 (3, −1)</text>
  <circle cx="513" cy="187" r="7" fill="#1d4ed8"/>
  <text x="579" y="209" class="note">現在地 (5, 1)</text>
  <path d="M513 187l60 -60" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#g)"/>
  <text x="583" y="99" class="note" style="fill:#b91c1c;font-weight:700">勾配 (+4, +4)</text>
  <text x="583" y="117" class="note" style="fill:#b91c1c">loss が増える向き</text>
  <path d="M513 187l-60 60" fill="none" stroke="#2563eb" stroke-width="3.5" marker-end="url(#u)"/>
  <rect x="355" y="257" width="184" height="42" rx="8" fill="#f8fafc"/>
  <text x="447" y="273" class="note" style="fill:#1d4ed8;font-weight:700">更新はこの逆向き</text>
  <text x="447" y="292" class="note" style="fill:#1d4ed8">(4.6, 0.6) へ</text>
  <text x="380" y="582" class="note">勾配は「最も急に loss が増える向き」。その <tspan font-weight="700">逆</tspan> に進むのが勾配降下法</text>
</svg>