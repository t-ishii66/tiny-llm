<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">ReLU activation function</title>
  <desc id="desc">ReLU(z) = max(0, z). The output is zero for negative inputs and equals the input for positive inputs.</desc>
  <rect width="640" height="400" rx="16" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="320" y="35" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">ReLU(z) = max(0, z)</text>
    <path d="M80 70H560 M80 150H560 M80 230H560 M80 310H560 M80 70V310 M160 70V310 M240 70V310 M400 70V310 M480 70V310 M560 70V310" fill="none" stroke="#e2e8f0"/>
    <g fill="none" stroke="#64748b" stroke-width="1.5">
      <path d="M60 310H595 M320 330V55"/>
      <path d="M589 305L595 310L589 315 M315 61L320 55L325 61"/>
    </g>
    <g fill="#475569" font-size="15" text-anchor="middle">
      <text x="80" y="345">−3</text>
      <text x="160" y="345">−2</text>
      <text x="240" y="345">−1</text>
      <text x="320" y="345">0</text>
      <text x="400" y="345">1</text>
      <text x="480" y="345">2</text>
      <text x="560" y="345">3</text>
    </g>
    <g fill="#475569" font-size="15" text-anchor="end">
      <text x="305" y="235">1</text>
      <text x="305" y="155">2</text>
      <text x="305" y="75">3</text>
    </g>
    <path d="M80 310H320L560 70" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="320" cy="310" r="5" fill="#2563eb"/>
    <g fill="#1d4ed8" font-size="17">
      <text x="110" y="285">Output = 0</text>
      <text x="445" y="125">Output = z</text>
    </g>
    <text x="335" y="65" font-size="15" fill="#475569">Output</text>
    <text x="320" y="380" text-anchor="middle" font-size="16" fill="#475569">Input (z)</text>
  </g>
</svg>
