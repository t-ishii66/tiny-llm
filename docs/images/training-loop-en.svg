<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="t d">
  <title id="t">The training loop</title>
  <desc id="d">Forward makes a prediction, Loss measures how wrong it is, Backward computes the gradients, and Update nudges the parameters. These four steps repeat 200 times.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#172554;text-anchor:middle}
      .st{font-size:18px;font-weight:700}.note{font-size:13px;fill:#475569}
      .arc{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="860" height="520" rx="24" fill="#f8fafc"/>
  <text x="430" y="40" font-size="23" font-weight="700">The training loop — repeated 200 times</text>
  <rect x="310" y="63" width="240" height="74" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="86" class="st">① Forward</text>
  <text x="430" y="106" class="note">predict with the current parameters</text>
  <text x="430" y="125" class="note" style="font-size:12px">inputs → logits</text>
  <rect x="520" y="233" width="240" height="74" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="640" y="256" class="st">② Loss</text>
  <text x="640" y="276" class="note">turn the error into a single number</text>
  <text x="640" y="295" class="note" style="font-size:12px">compare logits with targets</text>
  <rect x="310" y="403" width="240" height="74" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="430" y="426" class="st">③ Backward</text>
  <text x="430" y="446" class="note">which way should each parameter move</text>
  <text x="430" y="465" class="note" style="font-size:12px">compute gradients for every parameter</text>
  <rect x="100" y="233" width="240" height="74" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="256" class="st">④ Update</text>
  <text x="220" y="276" class="note">nudge them a little</text>
  <text x="220" y="295" class="note" style="font-size:12px">step against the gradient</text>
  <path d="M556 110L514 223" class="arc"/>
  <path d="M514 317L556 430" class="arc"/>
  <path d="M304 430L346 317" class="arc"/>
  <path d="M346 223L304 110" class="arc"/>
  <text x="430" y="266" style="font-size:16px;fill:#334155;font-weight:700">one lap = one epoch</text>
  <text x="430" y="290" class="note">the parameters improve a little</text>
  <text x="430" y="498" class="note">training stops after 200 laps (EPOCHS = 200)</text>
</svg>