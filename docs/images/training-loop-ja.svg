<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="t d">
  <title id="t">訓練ループ</title>
  <desc id="d">Forward で予測し、Loss で外れ具合を測り、Backward で勾配を求め、Update でパラメータを動かす。この 4 ステップを 200 回繰り返します。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#172554;text-anchor:middle}
      .st{font-size:18px;font-weight:700}.note{font-size:13px;fill:#475569}
      .arc{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="860" height="520" rx="24" fill="#f8fafc"/>
  <text x="430" y="40" font-size="23" font-weight="700">訓練ループ — これを 200 回くり返す</text>
  <rect x="310" y="63" width="240" height="74" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="86" class="st">① Forward</text>
  <text x="430" y="106" class="note">いまのパラメータで予測</text>
  <text x="430" y="125" class="note" style="font-size:12px">inputs → logits</text>
  <rect x="520" y="233" width="240" height="74" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="640" y="256" class="st">② Loss</text>
  <text x="640" y="276" class="note">正解とのズレを 1 つの数値に</text>
  <text x="640" y="295" class="note" style="font-size:12px">logits と targets を比較</text>
  <rect x="310" y="403" width="240" height="74" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="430" y="426" class="st">③ Backward</text>
  <text x="430" y="446" class="note">どちらへ動かせばよいか</text>
  <text x="430" y="465" class="note" style="font-size:12px">全パラメータの勾配を計算</text>
  <rect x="100" y="233" width="240" height="74" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="256" class="st">④ Update</text>
  <text x="220" y="276" class="note">少しだけ動かす</text>
  <text x="220" y="295" class="note" style="font-size:12px">勾配の逆向きに調整</text>
  <path d="M556 110L514 223" class="arc"/>
  <path d="M514 317L556 430" class="arc"/>
  <path d="M304 430L346 317" class="arc"/>
  <path d="M346 223L304 110" class="arc"/>
  <text x="430" y="266" style="font-size:16px;fill:#334155;font-weight:700">1 周 = 1 エポック</text>
  <text x="430" y="290" class="note">パラメータが少し改善する</text>
  <text x="430" y="498" class="note">200 周したところで訓練終了（EPOCHS = 200）</text>
</svg>