<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-labelledby="title desc">
  <title id="title">How the data changes inside the Transformer</title>
  <desc id="desc">A (28, 12) tensor of word ids becomes (28, 12, 64) after embedding, keeps that shape through self-attention and the feed-forward network, and finally becomes (28, 12, 10) scores through the output projection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#172554;text-anchor:middle}
      .shape{font-size:20px;font-weight:700;font-family:"SFMono-Regular",Consolas,monospace}
      .note{font-size:14px;fill:#475569}
      .op{font-size:15px;fill:#334155;text-anchor:end}
      .flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="760" height="720" rx="24" fill="#f8fafc"/>
  <text x="300" y="44" font-size="25" font-weight="700">How the data changes inside the Transformer</text>
  <text x="300" y="70" class="note">read bottom to top · how the shape changes</text>
  <rect x="110" y="620" width="380" height="62" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <text x="300" y="648" class="shape">token_ids (28, 12)</text><text x="300" y="670" class="note">integers (word ids)</text>
  <rect x="110" y="500" width="380" height="62" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="300" y="528" class="shape">x (28, 12, 64)</text><text x="300" y="550" class="note">each word becomes a 64-dim input embedding</text>
  <rect x="110" y="380" width="380" height="62" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="300" y="408" class="shape">x (28, 12, 64)</text><text x="300" y="430" class="note">now carries context from other words</text>
  <rect x="110" y="260" width="380" height="62" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="288" class="shape">x (28, 12, 64)</text><text x="300" y="310" class="note">each word's representation transformed again</text>
  <rect x="110" y="140" width="380" height="62" rx="14" fill="#fce7f3" stroke="#db2777"/>
  <text x="300" y="168" class="shape">logits (28, 12, 10)</text><text x="300" y="190" class="note">10 scores at every position</text>
  <path d="M300 594V564" class="flow"/>
  <text x="278" y="584" class="op">Token Embedding ＋ Positional Embedding</text>
  <path d="M300 474V444" class="flow"/>
  <text x="278" y="464" class="op">Self-Attention</text>
  <path d="M300 354V324" class="flow"/>
  <text x="278" y="344" class="op">Feed-Forward</text>
  <path d="M300 234V204" class="flow"/>
  <text x="278" y="224" class="op">final layer norm → output projection (× tok_emb.T)</text>
  <path d="M520 560V236" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M520 560H504 M520 236H504" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="612" y="386" style="fill:#b45309;font-size:15px">Transformer</text>
  <text x="612" y="408" style="fill:#b45309;font-size:15px">block × 2</text>
  <text x="612" y="436" style="fill:#b45309;font-size:14px">shape never changes</text>
</svg>