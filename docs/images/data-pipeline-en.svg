<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="t d">
  <title id="t">Data pipeline</title>
  <desc id="d">build_vocab turns the corpus string into a vocabulary, tokenize turns it into a list of ids, and make_training_data builds the input and target tensors.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#172554;text-anchor:middle}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px}
      .fn{font-size:14px;font-weight:700;fill:#1d4ed8;font-family:"SFMono-Regular",Consolas,monospace}
      .note{font-size:13px;fill:#475569}
      .flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="860" height="400" rx="24" fill="#f8fafc"/>
  <text x="430" y="40" font-size="23" font-weight="700">Chapter 1: the data pipeline</text>
  <rect x="40" y="76" width="290" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="185" y="103" class="mono">"the cat sat on ..."</text>
  <text x="185" y="124" class="note">corpus (a 40-token string)</text>
  <rect x="510" y="76" width="290" height="62" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="655" y="103" class="mono">{"the": 1, "cat": 2, ...}</text>
  <text x="655" y="124" class="note">vocab and id2word (10 words)</text>
  <path d="M340 114H500" class="flow"/>
  <text x="420" y="100" class="fn">build_vocab</text>
  <rect x="40" y="180" width="290" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="185" y="207" class="mono">"the cat sat on ..."</text>
  <text x="185" y="228" class="note">the same corpus</text>
  <rect x="510" y="180" width="290" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="655" y="207" class="mono">[1, 2, 3, 4, 1, 5, 6, ...]</text>
  <text x="655" y="228" class="note">a list of 40 ids</text>
  <path d="M340 218H500" class="flow"/>
  <text x="420" y="204" class="fn">tokenize</text>
  <rect x="40" y="284" width="290" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="185" y="311" class="mono">[1, 2, 3, 4, ...]</text>
  <text x="185" y="332" class="note">a list of ids</text>
  <rect x="510" y="284" width="290" height="62" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="655" y="311" class="mono">inputs / targets</text>
  <text x="655" y="332" class="note">two (28, 12) tensors</text>
  <path d="M340 322H500" class="flow"/>
  <text x="420" y="308" class="fn">make_training_data</text>
  <text x="430" y="376" class="note">string → vocabulary → ids → tensors. That is all Chapter 1 does; these inputs are where Chapter 2 begins.</text>
</svg>