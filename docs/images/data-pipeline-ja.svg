<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-labelledby="t d">
  <title id="t">データの流れ</title>
  <desc id="d">コーパスの文字列から build_vocab で語彙を作り、tokenize で番号列に変え、make_training_data で入力と正解のテンソルを作ります。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#172554;text-anchor:middle}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px}
      .fn{font-size:15px;font-weight:700;fill:#1d4ed8;font-family:"SFMono-Regular",Consolas,monospace}
      .note{font-size:13px;fill:#475569}
      .flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="820" height="400" rx="24" fill="#f8fafc"/>
  <text x="410" y="40" font-size="23" font-weight="700">第1章のデータの流れ</text>
  <rect x="60" y="76" width="320" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="220" y="103" class="mono">"the cat sat on ..."</text>
  <text x="220" y="124" class="note">コーパス（40 トークンの文字列）</text>
  <rect x="440" y="76" width="320" height="62" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="600" y="103" class="mono">{"the": 1, "cat": 2, ...}</text>
  <text x="600" y="124" class="note">vocab と id2word（語彙 10 語）</text>
  <path d="M386 107H432" class="flow"/>
  <text x="410" y="98" class="fn">build_vocab</text>
  <rect x="60" y="180" width="320" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="220" y="207" class="mono">"the cat sat on ..."</text>
  <text x="220" y="228" class="note">同じコーパス</text>
  <rect x="440" y="180" width="320" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="600" y="207" class="mono">[1, 2, 3, 4, 1, 5, 6, ...]</text>
  <text x="600" y="228" class="note">番号の列（40 個）</text>
  <path d="M386 211H432" class="flow"/>
  <text x="410" y="202" class="fn">tokenize</text>
  <rect x="60" y="284" width="320" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="220" y="311" class="mono">[1, 2, 3, 4, ...]</text>
  <text x="220" y="332" class="note">番号の列</text>
  <rect x="440" y="284" width="320" height="62" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="600" y="311" class="mono">inputs / targets</text>
  <text x="600" y="332" class="note">各 (28, 12) のテンソル</text>
  <path d="M386 315H432" class="flow"/>
  <text x="410" y="306" class="fn">make_training_data</text>
  <text x="410" y="376" class="note">文字列 → 語彙 → 番号列 → テンソル。ここまでが第1章の仕事で、この inputs が第2章の入口になる</text>
</svg>