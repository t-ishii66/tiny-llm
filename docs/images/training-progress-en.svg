<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="t d">
  <title id="t">How training progresses</title>
  <desc id="d">At epoch 1 the parameters are random and the loss is about 2.3; by epoch 100 it is about 0.39, and by epoch 200 about 0.11, with predictions almost always right.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#172554;text-anchor:middle}
      .hd{font-size:18px;font-weight:700}.note{font-size:13px;fill:#475569}
      .loss{font-size:26px;font-weight:700}
      .flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="820" height="430" rx="24" fill="#f8fafc"/>
  <text x="410" y="40" font-size="23" font-weight="700">How training progresses — the same loop, a falling loss</text>
  <rect x="30" y="70" width="250" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="155" y="104" class="hd">Epoch 1</text>
  <rect x="50" y="124" width="210" height="46" rx="10" fill="#e2e8f0"/>
  <text x="155" y="145" class="note" style="font-weight:700">parameters</text>
  <text x="155" y="163" class="note">random initial values</text>
  <path d="M155 176v16" class="flow"/>
  <rect x="50" y="196" width="210" height="46" rx="10" fill="#dbeafe"/>
  <text x="155" y="217" class="note" style="font-weight:700">what Forward predicts</text>
  <text x="155" y="235" class="note">nonsense</text>
  <path d="M155 248v16" class="flow"/>
  <rect x="50" y="268" width="210" height="76" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="155" y="292" class="note" style="font-weight:700">loss</text>
  <text x="155" y="326" class="loss" style="fill:#b91c1c">2.3</text>
  <rect x="285" y="70" width="250" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="104" class="hd">Epoch 100</text>
  <rect x="305" y="124" width="210" height="46" rx="10" fill="#e2e8f0"/>
  <text x="410" y="145" class="note" style="font-weight:700">parameters</text>
  <text x="410" y="163" class="note">largely adjusted</text>
  <path d="M410 176v16" class="flow"/>
  <rect x="305" y="196" width="210" height="46" rx="10" fill="#dbeafe"/>
  <text x="410" y="217" class="note" style="font-weight:700">what Forward predicts</text>
  <text x="410" y="235" class="note">mostly right</text>
  <path d="M410 248v16" class="flow"/>
  <rect x="305" y="268" width="210" height="76" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="410" y="292" class="note" style="font-weight:700">loss</text>
  <text x="410" y="326" class="loss" style="fill:#b45309">0.39</text>
  <rect x="540" y="70" width="250" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="665" y="104" class="hd">Epoch 200</text>
  <rect x="560" y="124" width="210" height="46" rx="10" fill="#e2e8f0"/>
  <text x="665" y="145" class="note" style="font-weight:700">parameters</text>
  <text x="665" y="163" class="note">close to optimal</text>
  <path d="M665 176v16" class="flow"/>
  <rect x="560" y="196" width="210" height="46" rx="10" fill="#dbeafe"/>
  <text x="665" y="217" class="note" style="font-weight:700">what Forward predicts</text>
  <text x="665" y="235" class="note">almost always right</text>
  <path d="M665 248v16" class="flow"/>
  <rect x="560" y="268" width="210" height="76" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="665" y="292" class="note" style="font-weight:700">loss</text>
  <text x="665" y="326" class="loss" style="fill:#15803d">0.11</text>
  <path d="M280 220h22" class="flow"/>
  <path d="M535 220h22" class="flow"/>
  <text x="410" y="412" class="note">Only the parameter values change. The loop itself (Forward → Loss → Backward → Update) is the same from start to finish.</text>
</svg>